<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <base href="./" />
    <title>Paint DX</title>
    <link rel="icon" type="image/png" href="assets/icone.png" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ECE9D8; /* Classic Windows XP dialog background */
            font-family: Tahoma, 'Segoe UI', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #paint_canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            outline: none;
        }

        /* Loading splash screen */
        #loading_screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: #ECE9D8;
            border: 2px outset #ffffff;
            padding: 24px 32px;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.3);
            font-size: 14px;
            color: #000;
            z-index: 9999;
            cursor: pointer;
        }

        .spinner {
            margin: 12px auto 0;
            width: 32px;
            height: 32px;
            border: 4px solid #0055EA;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    
    
    
<script type="module">
import init, * as bindings from './paint-dx-6df2e6a4d6c3488e.js';
const wasm = await init({ module_or_path: './paint-dx-69e27b47fef1e41e_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
<link rel="modulepreload" href="./paint-dx-6df2e6a4d6c3488e.js" crossorigin="anonymous" integrity="sha384-IZZrIACn8zX+4mvbf56q5yHtc8wWp+Dbd2q2zUJejcrhqK0HFwVpJBum+Llnkpq2"><link rel="preload" href="./paint-dx-69e27b47fef1e41e_bg.wasm" crossorigin="anonymous" integrity="sha384-1R3mKMbupv22c008AQg+sVwTTNq6ebXUHEkXjT1rtuSERqmZYSdiMwuUnctGbcfy" as="fetch" type="application/wasm"></head>
<body>
    <div id="loading_screen" title="Cliquez pour masquer si nécessaire">
        <div style="font-weight: bold; font-size: 16px; margin-bottom: 6px;">Paint DX</div>
        <div id="loading_status">Chargement de l'application en cours...</div>
        <div class="spinner" id="loading_spinner"></div>
    </div>
    <canvas id="paint_canvas"></canvas>

    <script>
        // Startup sound helper with autoplay policy recovery
        window.playStartupSound = function() {
            try {
                if (window.__paintDxSoundPlayed) return;

                const audioUrl = new URL("assets/startup.wav", document.baseURI).href;
                const audio = new Audio(audioUrl);
                audio.volume = 0.7;

                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        window.__paintDxSoundPlayed = true;
                    }).catch(() => {
                        // Browser autoplay policy blocked sound: unlock on first interaction
                        const unlock = () => {
                            if (window.__paintDxSoundPlayed) return;
                            audio.currentTime = 0;
                            audio.play().then(() => {
                                window.__paintDxSoundPlayed = true;
                            }).catch(() => {});
                            window.removeEventListener("pointerdown", unlock, true);
                            window.removeEventListener("keydown", unlock, true);
                        };
                        window.addEventListener("pointerdown", unlock, true);
                        window.addEventListener("keydown", unlock, true);
                    });
                }
            } catch (e) {
                console.warn("Could not play startup sound:", e);
            }
        };

        // Hide loader function (callable from JS and Rust WASM)
        function hideLoadingScreen() {
            const loader = document.getElementById("loading_screen");
            if (loader) {
                loader.style.display = "none";
            }
        }
        window.hideLoadingScreen = hideLoadingScreen;

        // Display fatal JS/WASM errors cleanly on screen
        window.addEventListener("error", (event) => {
            const loader = document.getElementById("loading_screen");
            if (loader) {
                const msg = event.message || (event.error && event.error.message) || String(event);
                loader.innerHTML = `
                    <div style="font-weight: bold; font-size: 16px; color: #cc0000; margin-bottom: 6px;">Erreur de chargement</div>
                    <div style="font-size: 12px; margin-bottom: 8px;">Paint DX n'a pas pu démarrer dans le navigateur :</div>
                    <div style="background: #fff; padding: 8px; font-family: monospace; font-size: 11px; text-align: left; max-width: 420px; overflow: auto; border: 1px inset #999; color: #333;">${msg}</div>
                `;
            }
        });

        // Hide loader when canvas becomes active or clicked
        const canvas = document.getElementById("paint_canvas");
        const loader = document.getElementById("loading_screen");
        if (loader) {
            loader.addEventListener("click", hideLoadingScreen);
        }

        if (canvas) {
            const observer = new MutationObserver(() => {
                if (canvas.width > 0 || canvas.height > 0) {
                    hideLoadingScreen();
                    observer.disconnect();
                }
            });
            observer.observe(canvas, { attributes: true, attributeFilter: ["width", "height", "style"] });

            // Periodic fallback check in case canvas dimension change was purely internal IDL
            let checks = 0;
            const checkInterval = setInterval(() => {
                checks++;
                if (canvas.width > 0 || canvas.height > 0 || checks > 40) {
                    hideLoadingScreen();
                    clearInterval(checkInterval);
                }
            }, 100);
        }
    </script>
</body>
</html>
