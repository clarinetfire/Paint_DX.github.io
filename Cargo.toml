[workspace]
resolver = "2"
members = [
    "crates/paint-core",
    "crates/paint-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Arthur"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
eframe = { version = "0.31", default-features = false, features = ["default", "wgpu"] }
egui = "0.31"
rfd = "0.15"
arboard = "3.4"
